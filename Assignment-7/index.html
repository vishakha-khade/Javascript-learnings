<!DOCTYPE html>
<html>
<head>
    <title>My Tables</title>
</head>
<body>
    <h1>Study Schedule</h1>
    <table border="1">
        <tr>
            <th colspan="3">Class Timetable</th>
        </tr>
        <tr>
            <th>Day</th>
            <th>Subject</th>
            <th>Time</th>
        </tr>
        <tr>
            <td rowspan="2">Monday</td>
            <td>HTML</td>
            <td>5:00 PM</td>
        </tr>
        <tr>
            <td>CSS</td>
            <td>07:00 PM</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>JavaScript</td>
            <td>8:00 PM</td>
        </tr>
    </table>
    <br><br>
    <h1>Gym Schedule</h1>
    <table border="1">
        <tr>
            <th colspan="3">Gym Schedule</th>
        </tr>
        <tr>

            <th>Day</th>
            <th>Exercise</th>
            <th>Duration</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>Running</td>
            <td>20 min</td>
        </tr>
        <tr>
             <td>Tuesday</td>
            <td>Push-ups</td>
            <td>10 min</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>Squats</td>
            <td>15 min</td>
        </tr>
    </table>

</body>
</html>
