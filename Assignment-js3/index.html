<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Operators</title>
</head>

<body>

<script>

    // Addition
    let a = 10;
    let b = 20;
    let addition = a + b;
    document.write("Addition: " + addition + "<br>");

    // Subtraction
    let c = 20;
    let d = 10;
    let subtraction = c - d;
    document.write("Subtraction: " + subtraction + "<br>");

    // Multiplication
    let e = 8;
    let f = 5;
    let multiplication = e * f;
    document.write("Multiplication: " + multiplication + "<br>");

    // Division
    let g = 10;
    let h = 5;
    let division = g / h;
    document.write("Division: " + division + "<br>");

    // Modulus
    let i = 10;
    let j = 3;
    let modulus = i % j;
    document.write("Modulus: " + modulus + "<br>");

    // Increment
    let num = 10;
    num++;
    document.write("Increment: " + num + "<br>");

    // Decrement
    let number = 10;
    number--;
    document.write("Decrement: " + number + "<br>");

    // Comparison
    let x = 10;
    let y = 20;

    let equal = x == y;
     document.write("Equal: " + equal + "<br>");

    let strictEqual = x === y;
    document.write("Strict Equal: " + strictEqual + "<br>");

    let notEqual = x != y;
      document.write("Not Equal: " + notEqual + "<br>");

    let greater = x > y;
    document.write("Greater Than: " + greater + "<br>");

    let less = x < y;
       document.write("Less Than: " + less + "<br>");

    let greaterEqual = x >= y;
      document.write("Greater Than or Equal: " + greaterEqual + "<br>");


    let lessEqual = x <= y;
    document.write("Less Than or Equal: " + lessEqual + "<br>");

    // Logical Operators
    let andResult = 5 > 3 && 4 > 2;
     document.write("AND: " + andResult + "<br>");

    let orResult = 5 > 10 || 4 > 2;
      document.write("OR: " + orResult + "<br>");


    let notResult = !(5 === 5);
    document.write("NOT: " + notResult);

</script>

</body>
</html>
