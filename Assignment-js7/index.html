<!DOCTYPE html>
<html>
<head>
    <title>Grade Checker</title>
</head>

<body>

<script>

const marks = prompt("Enter your marks");

if (marks >= 90) {
    document.write("Grade A");
} else {
    if (marks >= 75) {
        document.write("Grade B");
    } else {
        if (marks >= 50) {
            document.write("Grade C");
        } else {
            document.write("Fail");
        }
    }
}

</script>

</body>
</html>
