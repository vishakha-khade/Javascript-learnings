<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    
    <script>
        const numbers = [20,30,44,24,86,64];

        let sum = 0;

        for( let ans = 0; ans < numbers.length; ans++) {
            sum = sum + numbers[ans];
        }

        document.write("Sum: "+ sum);
    </script>
</body>
</html>
